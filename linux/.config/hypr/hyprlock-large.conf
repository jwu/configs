# hyprlock-large.conf -- full Style-10 layout for a large display, designed on
# 2560x1440.
#
# Every widget below leaves `monitor` empty, so the whole file applies to
# whatever outputs are attached. niri-lock picks this file when some output is
# at least 900px wide. See docs/lockscreen.md.

# Background: 1.78, so a 16:9 display only crops 7.8% off the top and bottom.
# This layout draws large text at 0.70 alpha, and hyprlock cannot dim a
# background to compensate (`brightness` only multiplies above 1.0), so the
# highest-contrast image is kept here. See docs/lockscreen.md.
background {
    monitor =
    path = ~/.config/swaylock/backgrounds/vantablack-1-twisted-stairs.webp
    blur_passes = 2
    contrast = 0.8916
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    hide_cursor = false
}

# Centre is (1280, 720); position's y grows upwards. The bottom button row uses
# halign=center with an x offset, so it stays centred and evenly spaced at any
# width. `onclick` uses systemctl -- `reboot now` / `shutdown now` do not exist
# on Arch.

# Day
label {
    monitor =
    text = cmd[update:1000] date +"%A"
    color = rgba(216, 222, 233, 0.70)
    font_size = 90
    font_family = Adwaita Sans Bold
    position = 0, 350
    halign = center
    valign = center
}

# Date-Month
label {
    monitor =
    text = cmd[update:1000] date +"%d %B"
    color = rgba(216, 222, 233, 0.70)
    font_size = 40
    font_family = Adwaita Sans Bold
    position = 0, 250
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"- %I:%M -")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 20
    font_family = Adwaita Sans Bold
    position = 0, 190
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false
    position = 0, -130
    halign = center
    valign = center
}

# USER (the leading glyph is Nerd Font U+F2BE)
label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 18
    font_family = FiraMono Nerd Font Propo
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Adwaita Sans Bold
    placeholder_text = <i><span foreground="##ffffff99">🔒 Enter Pass</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

# Suspend (bottom row, 160px apart)
label {
    monitor =
    text = 󰤄
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = FiraMono Nerd Font Propo
    onclick = systemctl suspend
    position = -160, 100
    halign = center
    valign = bottom
}

# Reboot
label {
    monitor =
    text = 󰜉
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = FiraMono Nerd Font Propo
    onclick = systemctl reboot
    position = 0, 100
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = FiraMono Nerd Font Propo
    onclick = systemctl poweroff
    position = 160, 100
    halign = center
    valign = bottom
}
