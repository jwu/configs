# hyprlock-medium.conf -- full layout for a mid-size display, designed on
# 1366x768.
#
# The large Style-10 layout is drawn on a 2560x1440 canvas and its fixed pixel
# offsets do not survive a 1366x768 panel: the 90px day name is pushed past the
# top edge and the bottom button row crowds the password column. The small style
# is built for a 480x320 panel and reads as a toy here. This file keeps every
# element the large style has -- day, date, time, user box, password field and
# the three power buttons -- at readable sizes, and places them with percentages
# of the output size so the layout reflows on any mid-size panel (1366x768,
# 1280x800, 1024x768) instead of only looking right on the display it was tuned
# on.
#
# Font sizes and box sizes stay in pixels on purpose: a percentage box shrinks
# the text along with the panel and would undo the point of a middle style.
# Positions are percentages because hyprlock treats them as a share of the
# output size and adds them on top of the alignment -- see
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/ ("All position and size options
# can be specified in pixels or as percentages of the output size").
#
# Every widget below leaves `monitor` empty, so the whole file applies to
# whatever outputs are attached. niri-lock picks this file when no output is at
# least 1600px wide but some output is at least 900px wide. See
# docs/lockscreen.md.

# Same image and tuning as the large style: it is the highest-contrast of the
# shipped backgrounds and hyprlock cannot dim a background to compensate for
# text drawn at 0.70 alpha (`brightness` only multiplies above 1.0).
background {
    monitor =
    path = ~/.config/swaylock/backgrounds/vantablack-1-twisted-stairs.webp
    blur_passes = 2
    contrast = 0.8916
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    hide_cursor = false
}

# Centre-relative offsets, y grows upwards, each a share of the output height:
# day +37%, date +28%, time +22.5%, user box -20%, password field -32%, button
# row 5% above the bottom edge. On 1366x768, taking line height as 1.2x the font
# size, that puts day at y 69-131, date 153-185, time 202-220, user box 514-562,
# field 606-654 and buttons 709-750: the tightest gap is 17px (date to time) and
# nothing touches, which is what the 900px minimum width is meant to buy.

# Day
label {
    monitor =
    text = cmd[update:1000] date +"%A"
    color = rgba(216, 222, 233, 0.70)
    font_size = 52
    font_family = Adwaita Sans Bold
    position = 0%, 37%
    halign = center
    valign = center
}

# Date-Month
label {
    monitor =
    text = cmd[update:1000] date +"%d %B"
    color = rgba(216, 222, 233, 0.70)
    font_size = 26
    font_family = Adwaita Sans Bold
    position = 0%, 28%
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"- %I:%M -")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 15
    font_family = Adwaita Sans Bold
    position = 0%, 22.5%
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 240, 48
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false
    position = 0%, -20%
    halign = center
    valign = center
}

# USER (the leading glyph is Nerd Font U+F2BE)
label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 16
    font_family = FiraMono Nerd Font Propo
    position = 0%, -20%
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Adwaita Sans Bold
    placeholder_text = <i><span foreground="##ffffff99">🔒 Enter Pass</span></i>
    hide_input = false
    position = 0%, -32%
    halign = center
    valign = center
}

# The three power buttons keep the large style's centred row, but 8% apart
# instead of 160px: on 1366x768 that is 109px between centres, close to the
# large style's visual density (160px on 2560), and it still leaves 38px of gap
# between 34px glyphs on the narrowest panel this style serves (900px).

# Suspend
label {
    monitor =
    text = 󰤄
    color = rgba(255, 255, 255, 0.6)
    font_size = 34
    font_family = FiraMono Nerd Font Propo
    onclick = systemctl suspend
    position = -8%, 5%
    halign = center
    valign = bottom
}

# Reboot
label {
    monitor =
    text = 󰜉
    color = rgba(255, 255, 255, 0.6)
    font_size = 34
    font_family = FiraMono Nerd Font Propo
    onclick = systemctl reboot
    position = 0%, 5%
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.6)
    font_size = 34
    font_family = FiraMono Nerd Font Propo
    onclick = systemctl poweroff
    position = 8%, 5%
    halign = center
    valign = bottom
}
