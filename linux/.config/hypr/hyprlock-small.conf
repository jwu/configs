# hyprlock-small.conf -- compact style for a small panel, designed on 480x320.
#
# Every widget below leaves `monitor` empty, so the whole file applies to
# whatever outputs are attached. niri-lock picks this file when no output is
# at least 900px wide. See docs/lockscreen.md.

# Background: 1.50 like the panel, so nothing gets cropped. Chosen by measured
# contrast against the clock colour, not by aspect ratio -- see docs/lockscreen.md.
background {
    monitor =
    path = ~/.config/swaylock/backgrounds/ristretto-0-launch.webp
    blur_passes = 2
    contrast = 0.8916
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    hide_cursor = false
}

# Centre is (240, 160) and position's y grows upwards: the plate spans
# y 121-251, the clock sits at centre y 186, and the password dots are centred
# at y 82, 16px below the plate.

# Frosted plate behind the clock
shape {
    monitor =
    size = 320, 130
    color = rgba(255, 255, 255, 0.07)
    rounding = 18
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, 26
    halign = center
    valign = center
}

# Clock -- the only always-visible element
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(226, 232, 240, 0.96)
    font_size = 60
    font_family = Adwaita Sans Bold
    position = 0, 26
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
}

# Invisible until you type: transparent inner/outer, empty placeholder, so only
# the password dots get drawn. Do not drop it -- without an input-field hyprlock
# still authenticates, but a wrong password gives no feedback at all.
input-field {
    monitor =
    size = 260, 46
    outline_thickness = 0
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0)
    font_color = rgba(255, 255, 255, 0.88)
    font_family = Adwaita Sans Bold
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    hide_input = false
    placeholder_text = ""
    fail_color = rgba(255, 138, 128, 0.9)
    # Font size is derived as size.y / 4 (~11px here). $ATTEMPTS is the failure
    # count; $FAIL is PAM's raw message and far too long for this panel.
    fail_text = <span foreground="##ff8a80">✗ $ATTEMPTS</span>
    position = 0, -78
    halign = center
    valign = center
}
