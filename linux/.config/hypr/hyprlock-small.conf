# hyprlock-small.conf -- compact style for a small panel, designed on 480x320.
#
# Every widget below leaves `monitor` empty, so the whole file applies to
# whatever outputs are attached. niri-lock picks this file when no output is
# at least 900px wide. See docs/lockscreen.md.

# Background: 1.50 like the panel, so nothing gets cropped. Chosen by measured
# contrast against the clock colour, not by aspect ratio -- see docs/lockscreen.md.
background {
    monitor =
    path = ~/.config/swaylock/backgrounds/ristretto-0-launch.webp
    blur_passes = 2
    contrast = 0.8916
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    hide_cursor = false
}

# Centre is (240, 160) and position's y grows upwards: the plate spans
# y 121-251, the clock sits at centre y 186, and the password field is centred at
# y 77, leaving 19px between it and the plate.

# Frosted plate behind the clock
shape {
    monitor =
    size = 320, 130
    color = rgba(255, 255, 255, 0.07)
    rounding = 18
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, 26
    halign = center
    valign = center
}

# Clock -- the only always-visible element
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(226, 232, 240, 0.96)
    font_size = 60
    font_family = Adwaita Sans Bold
    position = 0, 26
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
}

# Password field, matching the large layout's look: a frosted box with a prompt,
# so it is obvious where to type. Font size is derived as size.y / 4 (~12px
# here) rather than set directly, and the dots are drawn inside the box while
# you type.
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Adwaita Sans Bold
    placeholder_text = <i><span foreground="##ffffff99">🔒 Enter Pass</span></i>
    hide_input = false
    fail_color = rgba(255, 138, 128, 0.9)
    # $ATTEMPTS is the failure count; $FAIL is PAM's raw message and far too long
    # for this panel.
    fail_text = <span foreground="##ff8a80">✗ $ATTEMPTS</span>
    position = 0, -83
    halign = center
    valign = center
}
