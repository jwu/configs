# hyprlock — based on Style-10 of github.com/MrVivekRajan/Hyprlock-Styles
#
# Local changes vs. upstream Style-10:
#   - background: the swaylock wallpaper (blurred) instead of a screenshot of
#     the desktop. `path` may use `~`: hyprlock resolves it via absolutePath().
#   - font_family: "SF Pro Display Bold" is not installed here; use Adwaita Sans
#     for the plain-text labels. Icon labels use "FiraMono Nerd Font Propo":
#     hyprgraphics sizes the text texture from the *logical* extents, so glyphs
#     whose ink is wider than their advance get clipped on the right. Every Nerd
#     icon in the mono variant overflows its 0.8em advance (5-22px); the
#     proportional variant matches the ink (0-2px). See docs/lockscreen.md.
#   - the profile-photo `image` widget is dropped (commented out at the bottom).
#
# hyprlock searches $XDG_CONFIG_HOME/hypr/hyprlock.conf by default.

# BACKGROUND (same wallpaper as swaylock; hyprlock scales it to fill)
background {
    monitor =
    path = ~/.config/swaylock/backgrounds/vantablack-1-twisted-stairs.webp
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    hide_cursor = false
}

# Day
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 90
    font_family = Adwaita Sans Bold
    position = 0, 350
    halign = center
    valign = center
}

# Date-Month
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 40
    font_family = Adwaita Sans Bold
    position = 0, 250
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"- %I:%M -")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 20
    font_family = Adwaita Sans Bold
    position = 0, 190
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -130
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 18
    font_family = FiraMono Nerd Font Propo
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Adwaita Sans Bold
    placeholder_text = <i><span foreground="##ffffff99">🔒 Enter Pass</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

# Reboot
label {
    monitor =
    text = 󰜉
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = FiraMono Nerd Font Propo
    onclick = reboot now
    position = 0, 100
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = FiraMono Nerd Font Propo
    onclick = shutdown now
    position = 820, 100
    halign = left
    valign = bottom
}

# Suspend
label {
    monitor =
    text = 󰤄
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = FiraMono Nerd Font Propo
    onclick = systemctl suspend
    position = -820, 100
    halign = right
    valign = bottom
}

