# hyprlock -- two layouts, split by output name.
#
# hyprlock has no responsive units: font_size / position / size are all absolute
# pixels, and `monitor` only matches a port name or an EDID description string
# (never the resolution). The old single set of values was written for
# ~1920x1080, so it overflowed the 480x320 panel. Each output now gets its own:
#
#   DP-3       Dell U2722DX      2560x1440   full Style-10
#   HDMI-A-3   RTK HDMI panel     480x320    compact, time only
#
# `monitor =` (empty) means every output; only used for truly shared widgets.
# position's y grows upwards, `valign` picks the anchor. See docs/lockscreen.md
# for the reasoning, the measured contrast numbers and the other gotchas.

# Backgrounds are split per output and chosen by measured contrast rather than
# by aspect ratio alone -- matching the aspect ratio does not mean white text
# stays readable. Numbers are in docs/lockscreen.md.

# HDMI-A-3: warm orange, 1.50 like the panel, so nothing gets cropped
background {
    monitor = HDMI-A-3
    path = ~/.config/swaylock/backgrounds/ristretto-0-launch.webp
    blur_passes = 2
    contrast = 0.8916
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# DP-3: the original background. hyprlock cannot dim a background (brightness
# only applies above 1.0), so the highest-contrast image is kept here.
background {
    monitor = DP-3
    path = ~/.config/swaylock/backgrounds/vantablack-1-twisted-stairs.webp
    blur_passes = 2
    contrast = 0.8916
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    hide_cursor = false
}


# ═══════════════ HDMI-A-3 -- 480x320, centre (240, 160) ═══════════════
# Time is the only always-visible element: frosted plate y 121-251,
# clock centre y 186, password dots centred at y 82 below it.

# Frosted plate behind the clock
shape {
    monitor = HDMI-A-3
    size = 320, 130
    color = rgba(255, 255, 255, 0.07)
    rounding = 18
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, 26
    halign = center
    valign = center
}

# Clock
label {
    monitor = HDMI-A-3
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(226, 232, 240, 0.96)
    font_size = 60
    font_family = Adwaita Sans Bold
    position = 0, 26
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
}

# Invisible until you type: transparent inner/outer, empty placeholder, so only
# the password dots are drawn. Do not drop it -- without an input-field you can
# still unlock by typing blind, but a wrong password gives no feedback at all.
input-field {
    monitor = HDMI-A-3
    size = 260, 46
    outline_thickness = 0
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0)
    font_color = rgba(255, 255, 255, 0.88)
    font_family = Adwaita Sans Bold
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    hide_input = false
    placeholder_text = ""
    fail_color = rgba(255, 138, 128, 0.9)
    # Font size is derived as size.y / 4 (~11px here). $ATTEMPTS is the failure
    # count; $FAIL is PAM's raw message and far too long for this panel.
    fail_text = <span foreground="##ff8a80">✗ $ATTEMPTS</span>
    position = 0, -78
    halign = center
    valign = center
}


# ═══════════════ DP-3 -- 2560x1440, centre (1280, 720) ═══════════════
# Original Style-10 sizes. Only the bottom buttons moved: they used
# halign=left/right with x=+/-820, which was written for a 1920-wide screen and
# drifts toward the middle on wider ones. All three are halign=center with an x
# offset now, so they stay evenly spaced and centred at any width. onclick uses
# systemctl -- `reboot now` / `shutdown now` do not exist on Arch.

# Day
label {
    monitor = DP-3
    text = cmd[update:1000] date +"%A"
    color = rgba(216, 222, 233, 0.70)
    font_size = 90
    font_family = Adwaita Sans Bold
    position = 0, 350
    halign = center
    valign = center
}

# Date-Month
label {
    monitor = DP-3
    text = cmd[update:1000] date +"%d %B"
    color = rgba(216, 222, 233, 0.70)
    font_size = 40
    font_family = Adwaita Sans Bold
    position = 0, 250
    halign = center
    valign = center
}

# Time
label {
    monitor = DP-3
    text = cmd[update:1000] echo "<span>$(date +"- %I:%M -")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 20
    font_family = Adwaita Sans Bold
    position = 0, 190
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor = DP-3
    size = 300, 60
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false
    position = 0, -130
    halign = center
    valign = center
}

# USER (the leading glyph is Nerd Font U+F2BE)
label {
    monitor = DP-3
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 18
    font_family = FiraMono Nerd Font Propo
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor = DP-3
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Adwaita Sans Bold
    placeholder_text = <i><span foreground="##ffffff99">🔒 Enter Pass</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

# Suspend (bottom row, 160px apart)
label {
    monitor = DP-3
    text = 󰤄
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = FiraMono Nerd Font Propo
    onclick = systemctl suspend
    position = -160, 100
    halign = center
    valign = bottom
}

# Reboot
label {
    monitor = DP-3
    text = 󰜉
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = FiraMono Nerd Font Propo
    onclick = systemctl reboot
    position = 0, 100
    halign = center
    valign = bottom
}

# Power off
label {
    monitor = DP-3
    text = 󰐥
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = FiraMono Nerd Font Propo
    onclick = systemctl poweroff
    position = 160, 100
    halign = center
    valign = bottom
}
