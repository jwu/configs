# Bare `hyprlock` reads this path, so point it at a style rather than leaving it
# without any widgets. The real layouts live in hyprlock-large.conf (the default
# -- this repo targets ordinary desktop displays), hyprlock-medium.conf (for
# mid-size panels, 900-1599px wide, where the large layout overflows) and
# hyprlock-small.conf (for panels too small for the full layout, under 900px);
# niri-lock picks between them by output width, because hyprlock matches widgets
# to monitors by port name or EDID description only and never looks at the
# resolution. See docs/lockscreen.md.
source = ~/.config/hypr/hyprlock-large.conf
