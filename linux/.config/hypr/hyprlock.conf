# Bare `hyprlock` reads this path, so point it at a style rather than leaving it
# without any widgets. The real layouts live in hyprlock-small.conf and
# hyprlock-large.conf; niri-lock picks between them by output width, because
# hyprlock matches widgets to monitors by port name or EDID description only and
# never looks at the resolution. See docs/lockscreen.md.
source = ~/.config/hypr/hyprlock-small.conf
